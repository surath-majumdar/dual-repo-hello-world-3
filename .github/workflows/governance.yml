name: Centralized OPA/Rego Governance Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rego-front-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.56.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Run Centralized App Policies
        run: |
          conftest test Dockerfile catalog-info.yaml \
            --update git::https://github.com/surath-majumdar/platform-governance-policies.git//policies/app